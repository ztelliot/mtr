apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtr-agent
  namespace: mtr
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mtr-agent-node-reader
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mtr-agent-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mtr-agent-node-reader
subjects:
  - kind: ServiceAccount
    name: mtr-agent
    namespace: mtr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtr-agent-config
  namespace: mtr
data:
  render-agent-config.sh: |
    #!/bin/sh
    set -eu

    log() {
      printf '%s\n' "[render-agent-config] $*" >&2
    }

    if [ -n "${MTR_KUBERNETES_API_SERVER:-}" ]; then
      api_server="${MTR_KUBERNETES_API_SERVER}"
    else
      api_host="${KUBERNETES_SERVICE_HOST:?KUBERNETES_SERVICE_HOST is required}"
      api_port="${KUBERNETES_SERVICE_PORT_HTTPS:-443}"
      case "${api_host}" in
        *:*) api_host="[${api_host}]" ;;
      esac
      api_server="https://${api_host}:${api_port}"
    fi
    token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    ca_file="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    get_node_annotation() {
      key="$1"
      kubectl \
        --server="${api_server}" \
        --certificate-authority="${ca_file}" \
        --token="${token}" \
        get node "${MTR_NODE_NAME}" \
        -o "go-template={{with index .metadata.annotations \"${key}\"}}{{.}}{{end}}"
    }

    read_annotation() {
      key="$1"
      name="$2"
      max_attempts="${MTR_KUBERNETES_API_RETRIES:-5}"
      retry_delay="${MTR_KUBERNETES_API_RETRY_SECONDS:-2}"
      case "${max_attempts}" in
        *[!0-9]*|"") log "MTR_KUBERNETES_API_RETRIES must be an integer from 1 to 100"; return 1 ;;
      esac
      case "${retry_delay}" in
        *[!0-9]*|"") log "MTR_KUBERNETES_API_RETRY_SECONDS must be an integer from 0 to 60"; return 1 ;;
      esac
      if [ "${#max_attempts}" -gt 3 ] || [ "${max_attempts}" -lt 1 ] || [ "${max_attempts}" -gt 100 ]; then
        log "MTR_KUBERNETES_API_RETRIES must be an integer from 1 to 100"
        return 1
      fi
      if [ "${#retry_delay}" -gt 2 ] || [ "${retry_delay}" -gt 60 ]; then
        log "MTR_KUBERNETES_API_RETRY_SECONDS must be an integer from 0 to 60"
        return 1
      fi
      attempt=1
      err_file="/tmp/node-annotation-${name}.err"

      while :; do
        if value="$(get_node_annotation "${key}" 2>"${err_file}")"; then
          rm -f "${err_file}"
          if [ -n "${value}" ]; then
            log "${name}: annotation ${key} is set"
          else
            log "${name}: annotation ${key} is not set"
          fi
          printf '%s' "${value}"
          return 0
        fi

        err="$(cat "${err_file}")"
        if [ "${attempt}" -ge "${max_attempts}" ]; then
          log "failed to read ${key} after ${attempt} attempt(s): ${err}"
          rm -f "${err_file}"
          return 1
        fi

        log "failed to read ${key} on attempt ${attempt}/${max_attempts}: ${err}"
        log "retrying in ${retry_delay}s"
        sleep "${retry_delay}"
        attempt=$((attempt + 1))
      done
    }

    value_or_default() {
      name="$1"
      value="$2"
      fallback="$3"
      if [ -n "${value}" ]; then
        log "${name}: using node annotation value ${value}"
        printf '%s' "${value}"
      else
        log "${name}: node annotation missing, using fallback ${fallback}"
        printf '%s' "${fallback}"
      fi
    }

    validate_metadata() {
      name="$1"
      value="$2"
      if [ -z "${value}" ]; then
        return 0
      fi
      if [ "$(printf '%s' "${value}" | wc -l)" -ne 0 ] || \
         [ "${#value}" -gt 128 ] || \
         ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:/+ -]*$'; then
        log "${name}: annotation contains unsupported characters or is too long"
        return 1
      fi
    }

    validate_protocols() {
      case "$1" in
        ""|1|2|3) return 0 ;;
        *) log "protocols: annotation must be 1, 2, or 3"; return 1 ;;
      esac
    }

    validate_hide_first_hops() {
      value="$1"
      case "${value}" in
        "") return 0 ;;
        *[!0-9]*) log "hide_first_hops: annotation must be an integer from 0 to 255"; return 1 ;;
      esac
      if [ "${#value}" -gt 3 ] || [ "${value}" -gt 255 ]; then
        log "hide_first_hops: annotation must be an integer from 0 to 255"
        return 1
      fi
    }

    validate_capabilities() {
      value="$1"
      if [ -z "${value}" ]; then
        return 0
      fi
      case "${value}" in
        ,*|*,|*,,*) log "capabilities: annotation must be a comma-separated list without empty entries"; return 1 ;;
      esac
      if [ "${#value}" -gt 128 ] || [ "$(printf '%s' "${value}" | wc -l)" -ne 0 ]; then
        log "capabilities: annotation must be at most 128 characters and contain no line breaks"
        return 1
      fi
      count=0
      old_ifs="${IFS}"
      IFS=","
      for capability in ${value}; do
        capability="$(printf '%s' "${capability}" | xargs)"
        case "${capability}" in
          ping|traceroute|mtr|http|dns|port) count=$((count + 1)) ;;
          *) log "capabilities: unsupported capability in annotation"; return 1 ;;
        esac
      done
      IFS="${old_ifs}"
      if [ "${count}" -eq 0 ]; then
        log "capabilities: annotation must enable at least one capability"
        return 1
      fi
    }

    log "rendering agent config"
    log "node=${MTR_NODE_NAME}"
    log "api_server=${api_server}"

    country="$(read_annotation mtr.ztelliot.dev/country country)"
    region="$(read_annotation mtr.ztelliot.dev/region region)"
    provider="$(read_annotation mtr.ztelliot.dev/provider provider)"
    isp="$(read_annotation mtr.ztelliot.dev/isp isp)"
    protocols="$(read_annotation mtr.ztelliot.dev/protocols protocols)"
    hide_first_hops="$(read_annotation mtr.ztelliot.dev/hide-first-hops hide_first_hops)"
    capabilities="$(read_annotation mtr.ztelliot.dev/capabilities capabilities)"

    validate_metadata country "${country}"
    validate_metadata region "${region}"
    validate_metadata provider "${provider}"
    validate_metadata isp "${isp}"
    validate_protocols "${protocols}"
    validate_hide_first_hops "${hide_first_hops}"
    validate_capabilities "${capabilities}"

    country="$(value_or_default country "${country}" CN)"
    region="$(value_or_default region "${region}" k8s)"
    provider="$(value_or_default provider "${provider}" "")"
    isp="$(value_or_default isp "${isp}" bgp)"
    protocols="$(value_or_default protocols "${protocols}" 3)"
    hide_first_hops="$(value_or_default hide_first_hops "${hide_first_hops}" 0)"
    if [ -n "${capabilities}" ]; then
      log "capabilities: using node annotation"
    else
      log "capabilities: node annotation missing, using fallback ping,traceroute,mtr,http,dns,port"
    fi

    write_capabilities() {
      if [ -n "${capabilities}" ]; then
        old_ifs="${IFS}"
        IFS=","
        for capability in ${capabilities}; do
          capability="$(printf '%s' "${capability}" | xargs)"
          case "${capability}" in
            ping|traceroute|mtr|http|dns|port)
              printf '  - %s\n' "${capability}"
              ;;
            "")
              ;;
            *)
              log "capabilities: unsupported capability in annotation"
              return 1
              ;;
          esac
        done
        IFS="${old_ifs}"
      else
        printf '%s\n' \
          '  - ping' \
          '  - traceroute' \
          '  - mtr' \
          '  - http' \
          '  - dns' \
          '  - port'
      fi
    }

    cat > /work/agent.yaml <<EOF
    mode: "grpc"
    log_level: "info"
    country: "${country}"
    region: "${region}"
    provider: "${provider}"
    isp: "${isp}"
    protocols: ${protocols}
    hide_first_hops: ${hide_first_hops}
    capabilities:
    EOF
    write_capabilities >> /work/agent.yaml
    cat >> /work/agent.yaml <<EOF
    tls:
      enabled: true
      ca_files:
        - "/var/run/mtr/tls/ca.crt"
      cert_file: "/var/run/mtr/tls/tls.crt"
      key_file: "/var/run/mtr/tls/tls.key"
    EOF

    log "wrote /work/agent.yaml"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mtr-agent
  namespace: mtr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mtr-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtr-agent
    spec:
      serviceAccountName: mtr-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: render-agent-config
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /config/render-agent-config.sh
          env:
            - name: MTR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOME
              value: /tmp
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: generated-config
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      containers:
        - name: agent
          image: ghcr.io/ztelliot/mtr-agent:latest
          imagePullPolicy: Always
          args:
            - -config
            - /etc/mtr/agent.yaml
          env:
            - name: MTR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MTR_SERVER_ADDR
              value: mtr-server.mtr.svc.cluster.local:8443
            - name: MTR_REGISTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mtr-agent-env
                  key: register-token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            # ICMP probes need NET_RAW in the effective set. Keep UID 0 here;
            # the image itself defaults to an unprivileged user for UDP/TCP-only use.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          volumeMounts:
            - name: generated-config
              mountPath: /etc/mtr/agent.yaml
              subPath: agent.yaml
              readOnly: true
            - name: tls
              mountPath: /var/run/mtr/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mtr-agent-config
            defaultMode: 0755
        - name: generated-config
          emptyDir: {}
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tls
          secret:
            secretName: mtr-agent-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtr-server
  namespace: mtr
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtr-server-config
  namespace: mtr
data:
  server.yaml: |
    http_addr: ":8080"
    grpc_addr: ":8443"
    log_level: "info"
    # Broad peer ranges are safe here only together with mtr-server-ingress,
    # which admits port 8080 solely from the mtr-web Pod.
    trusted_proxies:
      - "0.0.0.0/0"
      - "::/0"
    # Trusted only because the baseline NetworkPolicy permits HTTP ingress
    # from the mtr-web Pod and Caddy overwrites this header from RemoteAddr.
    client_ip_headers: []
    tls:
      enabled: true
      ca_files:
        - "/var/run/mtr/tls/ca.crt"
      cert_file: "/var/run/mtr/tls/tls.crt"
      key_file: "/var/run/mtr/tls/tls.key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtr-server
  namespace: mtr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mtr-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtr-server
    spec:
      serviceAccountName: mtr-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: ClusterFirst
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/ztelliot/mtr-server:latest
          imagePullPolicy: Always
          args:
            - -config
            - /etc/mtr/server.yaml
          env:
            - name: MTR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mtr-server-env
                  key: database-url
            - name: MTR_BOOTSTRAP_ADMIN_TOKEN_FILE
              value: /var/run/mtr/bootstrap/admin-token
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/mtr/server.yaml
              subPath: server.yaml
              readOnly: true
            - name: tls
              mountPath: /var/run/mtr/tls
              readOnly: true
            - name: postgres-ca
              mountPath: /var/run/mtr/postgres
              readOnly: true
            - name: bootstrap-admin-token
              mountPath: /var/run/mtr/bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mtr-server-config
        - name: tls
          secret:
            secretName: mtr-server-tls
            defaultMode: 0440
        - name: postgres-ca
          secret:
            secretName: mtr-server-postgres-ca
            defaultMode: 0440
        - name: bootstrap-admin-token
          secret:
            secretName: mtr-server-bootstrap
            optional: true
            defaultMode: 0440
            items:
              - key: admin-token
                path: admin-token
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mtr-server
  namespace: mtr
spec:
  selector:
    app.kubernetes.io/name: mtr-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8443
      targetPort: grpc

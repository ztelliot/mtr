apiVersion: v1
kind: Secret
metadata:
  name: mtr-server-env
  namespace: mtr
type: Opaque
stringData:
  database-url: "postgres://mtr:REPLACE_WITH_DATABASE_PASSWORD@postgres:5432/mtr?sslmode=verify-full&sslrootcert=/var/run/mtr/postgres/ca.crt"
---
apiVersion: v1
kind: Secret
metadata:
  name: mtr-server-bootstrap
  namespace: mtr
type: Opaque
stringData:
  admin-token: REPLACE_WITH_RANDOM_ADMIN_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: mtr-server-postgres-ca
  namespace: mtr
type: Opaque
stringData:
  ca.crt: |
    REPLACE_WITH_POSTGRES_CA_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: mtr-server-tls
  namespace: mtr
type: Opaque
stringData:
  ca.crt: |
    REPLACE_WITH_FULL_CA_PEM
  tls.crt: |
    REPLACE_WITH_FULL_SERVER_CERT_PEM
  tls.key: |
    REPLACE_WITH_FULL_SERVER_KEY_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: mtr-agent-env
  namespace: mtr
type: Opaque
stringData:
  register-token: REPLACE_WITH_MANAGED_REGISTER_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: mtr-agent-tls
  namespace: mtr
type: Opaque
stringData:
  ca.crt: |
    REPLACE_WITH_FULL_CA_PEM
  tls.crt: |
    REPLACE_WITH_FULL_SHARED_AGENT_CERT_PEM
  tls.key: |
    REPLACE_WITH_FULL_SHARED_AGENT_KEY_PEM

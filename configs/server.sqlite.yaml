http_addr: ":8080"
grpc_addr: ":8443"
log_level: "debug"
database_url: "sqlite://./mtr.db"
geoip_url: "http://geoip:8080"
# Reverse proxy IPs/CIDRs allowed to supply client IP headers.
trusted_proxies: []
# Custom single-IP headers accepted only when the direct peer matches
# trusted_proxies. X-Real-IP is handled separately under the same trust rule.
client_ip_headers: []
tls:
  enabled: false
  ca_files: []
  cert_file: ""
  key_file: ""

name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  USERNAME: ztelliot
  REPO: mtr

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ startsWith(github.ref, 'refs/tags/v') || steps.filter.outputs.go == 'true' }}
      web: ${{ startsWith(github.ref, 'refs/tags/v') || steps.filter.outputs.web == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - ".github/workflows/image.yml"
              - ".dockerignore"
              - "Dockerfile.agent"
              - "Dockerfile.server"
              - "cmd/**"
              - "go.mod"
              - "go.sum"
              - "internal/**"
            web:
              - ".github/workflows/image.yml"
              - ".dockerignore"
              - "Dockerfile.web"
              - "web/**"

  build-go-images:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [agent, server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect optional registries
        id: registries
        env:
          DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image names
        id: image-names
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${USERNAME}/${REPO}-${COMPONENT}"

            if [ "${{ steps.registries.outputs.dockerhub }}" = "true" ]; then
              echo "${USERNAME}/${REPO}-${COMPONENT}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-names.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set build args
        id: build-args
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '%s\n' "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          printf '%s\n' "BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Prepare Go image build targets
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          component = os.environ["COMPONENT"]
          metadata = json.loads(os.environ["IMAGE_METADATA"])
          common = {
              "context": ".",
              "dockerfile": f"Dockerfile.{component}",
              "args": {key: os.environ[key] for key in ("VERSION", "COMMIT", "BUILT_AT")},
              "labels": metadata["labels"],
          }
          targets = {
              "image": {
                  **common,
                  "platforms": ["linux/amd64", "linux/arm64"],
                  "tags": metadata["tags"],
              },
          }
          if component == "agent":
              for arch in ("amd64", "arm64"):
                  targets[f"lambda-{arch}"] = {
                      **common,
                      "target": "lambda",
                      "platforms": [f"linux/{arch}"],
                      "tags": [
                          f"{image}-lambda:{tag}-{arch}"
                          for image, tag in (value.rsplit(":", 1) for value in metadata["tags"])
                      ],
                      "attest": ["type=provenance,disabled=true", "type=sbom,disabled=true"],
                  }
          definition = {"group": {"default": {"targets": list(targets)}}, "target": targets}
          Path(os.environ["RUNNER_TEMP"], "go-images.bake.json").write_text(json.dumps(definition))
          PYTHON

      - name: Build and push Go images
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ runner.temp }}/go-images.bake.json
          push: true

  build-web-image:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect optional registries
        id: registries
        env:
          DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image names
        id: image-names
        env:
          COMPONENT: web
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${USERNAME}/${REPO}-${COMPONENT}"

            if [ "${{ steps.registries.outputs.dockerhub }}" = "true" ]; then
              echo "${USERNAME}/${REPO}-${COMPONENT}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-names.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set build args
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '%s\n' "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          printf '%s\n' "BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILT_AT=${{ env.BUILT_AT }}
